apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: todo}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: todo-app
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: todo-config}
            - secretRef: {name: todo-secret}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: todo}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: api, namespace: todo}
spec:
  rules:
    - host: todo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: api, port: {number: 80}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: todo}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: todo-app
          command: [celery, -A, app.celery_app, worker, -l, info]
          envFrom:
            - configMapRef: {name: todo-config}
            - secretRef: {name: todo-secret}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
---
# Exactly one beat instance, otherwise scheduled tasks run multiple times.
apiVersion: apps/v1
kind: Deployment
metadata: {name: beat, namespace: todo}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: beat}}
  template:
    metadata: {labels: {app: beat}}
    spec:
      containers:
        - name: beat
          image: todo-app
          command: [celery, -A, app.celery_app, beat, -l, info, -s, /tmp/celerybeat-schedule]
          envFrom:
            - configMapRef: {name: todo-config}
            - secretRef: {name: todo-secret}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
