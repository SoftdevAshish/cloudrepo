name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && mypy app && pytest
  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.repo.outputs.name }}
    steps:
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: k8s
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
        run: |
          kustomize edit set image todo-app=$IMAGE
          (cd migrate && kustomize edit set image todo-app=$IMAGE)
          # 1. namespace, config and databases
          kubectl apply -f namespace.yaml -f config.yaml -f infra.yaml
          kubectl -n todo rollout status statefulset/postgres --timeout=180s
          # 2. migrate before the new code rolls out (Job specs are immutable, so recreate it)
          kubectl -n todo delete job migrate --ignore-not-found
          kubectl apply -k migrate
          kubectl -n todo wait --for=condition=complete job/migrate --timeout=300s \
            || { kubectl -n todo logs job/migrate --tail=50; exit 1; }
          # 3. roll out the application
          kubectl apply -k .
          kubectl -n todo rollout status deploy/api --timeout=180s
          kubectl -n todo rollout status deploy/worker --timeout=180s
          kubectl -n todo rollout status deploy/beat --timeout=180s
