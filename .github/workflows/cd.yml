name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && mypy app && pytest
  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.repo.outputs.name }}
    steps:
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: k8s
        run: |
          kustomize edit set image todo-app=${{ needs.build-push.outputs.image }}:${{ github.sha }}
          kubectl apply -k .
          kubectl -n todo rollout status deploy/api --timeout=180s
          kubectl -n todo rollout status deploy/worker --timeout=180s
          kubectl -n todo rollout status deploy/beat --timeout=180s
